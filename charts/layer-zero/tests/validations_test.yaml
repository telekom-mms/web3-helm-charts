# yamllint disable rule:line-length
---
suite: "Test Validations"
templates:
  - "tests/validations.yaml"
release:
  name: "test-release"
  namespace: "test-namespace"
tests:
  - it: "Should fail to render if metrics.serviceMonitor.enabled is true, but metrics.enabled is false"
    set:
      metrics:
        serviceMonitor:
          enabled: true
        enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "If metrics.serviceMonitor.enabled is true, metrics.enabled must be true!"
  - it: "Should fail to render if signer.type is unknown"
    set:
      signer.type: "FOO"
    asserts:
      - failedTemplate:
          errorMessage: "signer.type must be LOCAL_MNEMONIC or KMS!"
  - it: "Should fail to render if signer.type is KMS, but signer.kms.keyId is not set"
    set:
      signer.type: "KMS"
      signer.kms.region: "eu-central-1"
    asserts:
      - failedTemplate:
          errorMessage: "signer.kms.keyId must be set if signer.type is KMS!"
  - it: "Should fail to render if signer.type is KMS, but signer.kms.region is not set"
    set:
      signer.type: "KMS"
      signer.kms.keyId: "key-id"
    asserts:
      - failedTemplate:
          errorMessage: "signer.kms.region must be set if signer.type is KMS!"
  - it: "Should render with default values"
    asserts:
      - notFailedTemplate: {}
...
# yamllint enable rule:line-length
